<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141F1A">
<meta name="description" content="Speisekarte — Mezze, Grill, Shawarma und Süßes aus der levantinischen Küche.">
<meta name="robots" content="noindex, nofollow">
<title>Speisekarte</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&family=Amiri:wght@400;700&family=Cairo:wght@400;600&display=swap">
<link rel="stylesheet" href="stil.css">
</head>
<body>

<div id="entwurfsbalken" hidden></div>

<header>
  <div class="huelle kopf-reihe">
    <div class="kopf-marke-block" id="kopf-marke"></div>
    <div class="kopf-werkzeug">
      <span class="zustand" id="zustand"></span>
      <div class="sprachschalter" role="group" aria-label="Sprache">
        <button type="button" data-sprache="de" aria-pressed="true">DE</button>
        <button type="button" data-sprache="ar" aria-pressed="false">ع</button>
      </div>
    </div>
  </div>
  <nav id="sprungleiste" aria-label="Abschnitte"><ul></ul></nav>
</header>

<section class="buehne" id="buehne"></section>

<main class="huelle">
  <div class="filterzeile">
    <label class="suche">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="suchfeld" autocomplete="off" aria-label="Gericht suchen">
    </label>
    <div class="merkmalfilter" id="merkmalfilter"></div>
  </div>
  <div id="karte"></div>
</main>

<section class="galerie" id="galerie" hidden></section>

<section class="angaben" id="angaben"></section>

<footer class="huelle" id="fussnote"></footer>

<script src="daten.js"></script>
<script src="seite.js"></script>
</body>
</html>
