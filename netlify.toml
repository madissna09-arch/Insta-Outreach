# Netlify: es wird nur der Ordner mit der Speisekarten-Website veroeffentlicht.
[build]
  publish   = "speisekarte"
  command   = ""

# Bilder und Schriften sind versioniert -> lange Cache-Zeit
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control            = "public, max-age=0, must-revalidate"
    X-Content-Type-Options   = "nosniff"
    Referrer-Policy          = "strict-origin-when-cross-origin"
    X-Frame-Options          = "SAMEORIGIN"
